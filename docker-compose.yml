# ultimateXnova friends-edition
# 1. cp .env.example .env and fill in every value
# 2. docker compose up -d --build
# The database is NOT published to the host; only the web port is, and only on 127.0.0.1.
# Put a reverse proxy / Cloudflare Tunnel / Tailscale in front of it for your friends.
name: ultimatexnova

services:
  web:
    build: .
    env_file: .env
    environment:
      DB_HOST: db
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - cache:/var/www/html/cache
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mariadb:11.4
    command: ["--sql-mode=NO_ENGINE_SUBSTITUTION", "--innodb-file-per-table=1"]
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30
    restart: unless-stopped

volumes:
  dbdata:
  cache:
