ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Never serve internals, runtime state, dumps or secrets
<DirectoryMatch "^/var/www/html/(includes|cache|docker|tests|\.git)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(^\.|\.(sql|log|md|lock|ini|env|sh|txt|tpl|bak|dist)$|^composer\.(json|lock)$|^Dockerfile$|^docker-compose)">
    Require all denied
</FilesMatch>
<FilesMatch "^robots\.txt$">
    Require all granted
</FilesMatch>

# The web installer is only reachable while ALLOW_INSTALL=1 is set on the container
<Directory /var/www/html/install>
    <If "osenv('ALLOW_INSTALL') != '1'">
        Require all denied
    </If>
</Directory>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
</IfModule>
